# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::pkgdown
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # tidybreed is pre-1.0 and currently carries a known non-ASCII WARNING
          # (em-dashes and box-drawing characters in R/). Fail only on genuine
          # ERRORs until that cleanup lands, then tighten this to '"warning"'.
          error-on: '"error"'
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # R CMD check does not look at _pkgdown.yml, so renaming an exported
      # function can pass every test here and still break the docs site. That is
      # exactly what happened when define_chr() became define_chromosome(): the
      # pkgdown workflow failed on every push for five days while this job stayed
      # green. check_pkgdown() verifies that every topic named in the reference
      # index exists AND that no public topic is missing from it — the two ways
      # that file drifts out of sync with the package.
      #
      # It reads man/*.Rd straight from the source tree, so it needs pkgdown but
      # not an installed tidybreed, and runs in seconds.
      #
      # Linux only: the config is OS-independent, so checking it twice adds
      # nothing. always() so a failing R CMD check above cannot hide a broken
      # reference index — both problems surface in the same run.
      - name: Validate _pkgdown.yml reference index
        if: always() && runner.os == 'Linux'
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}
